name: CI

on:
  pull_request:
    branches:
      - main
    # Listing `types` at all replaces the defaults, so the three default
    # activity types are repeated here alongside `ready_for_review`.
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  # Pushes to main deliberately do not build. Every merge arrives through a
  # pull request that already ran this matrix against the same content, so the
  # post-merge run almost always repeats work that was just done.
  workflow_dispatch:

# Draft pull requests are skipped: work in progress does not need to burn CI
# minutes on every push. The full matrix runs on the `ready_for_review` event
# and on every push to the branch afterwards. Skipped jobs still report a
# neutral "skipped" conclusion, which branch protection accepts as satisfied,
# so a draft PR is not blocked by checks that never ran.
#
# Read-only token is sufficient for build + test. Using the `pull_request`
# trigger (instead of `pull_request_target`) means PRs from forks run in the
# context of the fork with a read-only GITHUB_TOKEN and no access to secrets,
# so external contributions are validated safely.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build solution
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Setup Node.js
        # The Tailwind generator builds its embedded JavaScript bundle from
        # source; Resources/ is generated output, not committed.
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Natrix.TailwindCss.Generators/js/package-lock.json

      - name: Restore workloads
        run: dotnet workload restore Natrix.slnx

      - name: Build
        run: dotnet build Natrix.slnx -c Release

  unit-tests:
    name: Unit tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        project:
          - src/Natrix.Signals.Tests/Natrix.Signals.Tests.csproj
          - src/Natrix.Ssr.Tests/Natrix.Ssr.Tests.csproj
          - src/Natrix.Swr.Tests/Natrix.Swr.Tests.csproj
          - src/Natrix.Core.Generators.Tests/Natrix.Core.Generators.Tests.csproj
          - src/Natrix.TailwindCss.Tests/Natrix.TailwindCss.Tests.csproj
        tfm:
          - net9.0
          - net10.0

        # Everything above is portable managed code and runs on Linux only.
        #
        # The Tailwind generator is the one exception in the repository: it loads
        # a per-RID native V8 library, picks its ClearScript flavor from the
        # compiler host's runtime, and resolves stylesheet paths with
        # host-dependent case sensitivity. So it also runs on Windows and macOS.
        # These entries conflict with the single `os` value above, so Actions
        # appends them as extra jobs rather than merging them in.
        #
        # One TFM is enough there: the test host's framework does not change
        # which engine flavor is selected. And note what this still does *not*
        # cover - `dotnet test` on Windows runs VBCSCompiler on modern .NET, so
        # the `net462` flavor stays unexercised. That needs MSBuild.exe or
        # devenv.exe from a Visual Studio install.
        include:
          - os: windows-latest
            project: src/Natrix.TailwindCss.Tests/Natrix.TailwindCss.Tests.csproj
            tfm: net10.0
          - os: macos-latest
            project: src/Natrix.TailwindCss.Tests/Natrix.TailwindCss.Tests.csproj
            tfm: net10.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Setup Node.js
        # Only the Tailwind generator needs it, to build its embedded bundle.
        if: matrix.project == 'src/Natrix.TailwindCss.Tests/Natrix.TailwindCss.Tests.csproj'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Natrix.TailwindCss.Generators/js/package-lock.json

      - name: Test ${{ matrix.project }} (${{ matrix.tfm }})
        run: dotnet test ${{ matrix.project }} -c Release -f ${{ matrix.tfm }}

  browser-tests:
    name: Browser (WASM) tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - Natrix.WebIDLGenerator.Tests
          - Natrix.Browser.Tests
        tfm:
          - net9.0
          - net10.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore workloads
        run: dotnet workload restore Natrix.slnx

      - name: Run ${{ matrix.profile }} (${{ matrix.tfm }})
        # The runner builds the browser-wasm test bundle for its own TFM and
        # executes it in headless Chromium (ChromeForTesting + PuppeteerSharp).
        run: dotnet run --project src/Natrix.BrowserTestsRunner -f ${{ matrix.tfm }} --launch-profile ${{ matrix.profile }}
