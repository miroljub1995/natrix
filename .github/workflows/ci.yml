name: CI

on:
  pull_request:
    branches:
      - main
    # Listing `types` at all replaces the defaults, so the three default
    # activity types are repeated here alongside `ready_for_review`.
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  # Pushes to main deliberately do not build. Every merge arrives through a
  # pull request that already ran these tests against the same content, so the
  # post-merge run almost always repeats work that was just done.
  workflow_dispatch:

# Draft pull requests are skipped: work in progress does not need to burn CI
# minutes on every push. The tests run on the `ready_for_review` event
# and on every push to the branch afterwards. Skipped jobs still report a
# neutral "skipped" conclusion, which branch protection accepts as satisfied,
# so a draft PR is not blocked by checks that never ran.
#
# Read-only token is sufficient for build + test. Using the `pull_request`
# trigger (instead of `pull_request_target`) means PRs from forks run in the
# context of the fork with a read-only GITHUB_TOKEN and no access to secrets,
# so external contributions are validated safely.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # The name is the check the "CI" ruleset requires; renaming the job means
    # updating the ruleset too.
    name: Tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Linux only. `dotnet test` on the solution builds every project, so there is
    # no separate build job, and then runs every test project for every TFM it
    # targets, including the browser-wasm ones in headless Chromium.
    #
    # Windows and macOS jobs used to run the Tailwind generator's tests, because
    # it loaded a native V8 library per OS. It now runs on Jint, which is
    # managed code, so those jobs repeated what Linux already covers. What is
    # still OS-specific is Natrix.Browser.TestHost (the Chrome download, the
    # native launcher), which only Linux exercises here. It is not shipped, so
    # it matters only to contributors on other systems.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Setup Node.js
        # The Tailwind generator builds its embedded JavaScript bundle from
        # source; Resources/ is generated output, not committed.
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Natrix.TailwindCss.Generators/js/package-lock.json

      - name: Restore workloads
        # The browser-wasm projects need the wasm-tools workload.
        run: dotnet workload restore Natrix.slnx

      - name: Test
        run: dotnet test Natrix.slnx -c Release
