name: CI

on:
  pull_request:
    branches:
      - main
    # Listing `types` at all replaces the defaults, so the three default
    # activity types are repeated here alongside `ready_for_review`.
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  # Pushes to main deliberately do not build. Every merge arrives through a
  # pull request that already ran this matrix against the same content, so the
  # post-merge run almost always repeats work that was just done.
  workflow_dispatch:

# Draft pull requests are skipped: work in progress does not need to burn CI
# minutes on every push. The full matrix runs on the `ready_for_review` event
# and on every push to the branch afterwards. Skipped jobs still report a
# neutral "skipped" conclusion, which branch protection accepts as satisfied,
# so a draft PR is not blocked by checks that never ran.
#
# Read-only token is sufficient for build + test. Using the `pull_request`
# trigger (instead of `pull_request_target`) means PRs from forks run in the
# context of the fork with a read-only GITHUB_TOKEN and no access to secrets,
# so external contributions are validated safely.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # One job per operating system, so branch protection needs three required
      # checks instead of one per (project, TFM) pair.
      #
      # Linux runs the whole solution: `dotnet test` on the solution builds every
      # project (which is why there is no separate build job) and then runs every
      # test project for every TFM it targets, including the browser-wasm ones in
      # headless Chromium.
      #
      # Everything is portable managed code except the Tailwind generator: it
      # loads a per-RID native V8 library, picks its ClearScript flavor from the
      # compiler host's runtime, and resolves stylesheet paths with host-dependent
      # case sensitivity. So its tests also run on Windows and macOS. Only that
      # project runs there, on one TFM: the test host's framework does not change
      # which engine flavor is selected, and the wasm AOT builds would only add
      # minutes. What this still does *not* cover is the `net462` flavor, since
      # `dotnet test` on Windows runs VBCSCompiler on modern .NET. That needs
      # MSBuild.exe or devenv.exe from a Visual Studio install.
      matrix:
        include:
          - os: ubuntu-latest
            test: dotnet test Natrix.slnx -c Release
          - os: windows-latest
            test: dotnet test src/Natrix.TailwindCss.Tests/Natrix.TailwindCss.Tests.csproj -c Release -f net10.0
          - os: macos-latest
            test: dotnet test src/Natrix.TailwindCss.Tests/Natrix.TailwindCss.Tests.csproj -c Release -f net10.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Setup Node.js
        # The Tailwind generator builds its embedded JavaScript bundle from
        # source; Resources/ is generated output, not committed.
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Natrix.TailwindCss.Generators/js/package-lock.json

      - name: Restore workloads
        # Only the browser-wasm projects need the wasm-tools workload, and they
        # only run on Linux.
        if: matrix.os == 'ubuntu-latest'
        run: dotnet workload restore Natrix.slnx

      - name: Test
        run: ${{ matrix.test }}
