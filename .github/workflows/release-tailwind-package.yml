name: Release Tailwind Package

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: read
  id-token: write

concurrency:
  group: release-tailwind-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Natrix.TailwindCss
    runs-on: ubuntu-latest
    env:
      MINIMUM_NATRIX_CORE_VERSION: 0.4.0
      MINIMUM_NATRIX_API_VERSION: 0.1.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node.js
        # Builds the embedded Tailwind bundle that gets packed into the analyzer;
        # Resources/ is generated output, not committed.
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Natrix.TailwindCss.Generators/js/package-lock.json

      - name: Resolve release version from Tailwind package
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version=$(dotnet msbuild src/Natrix.TailwindCss/Natrix.TailwindCss.csproj -nologo -v:q -getProperty:NatrixTailwindVersion | tr -d '\r\n')
          if [[ -z "$version" ]]; then
            echo "Failed to resolve Version from src/Natrix.TailwindCss/Natrix.TailwindCss.csproj"
            exit 1
          fi

          tag="tailwind/v${version}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          echo "Resolved version: $version"
          echo "Release tag: $tag"

      - name: Check if GitHub release already exists
        id: release_check
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;

            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });

              core.info(`Release already exists for tag ${tag}. Skipping pipeline.`);
              core.setOutput('exists', 'true');
            } catch (error) {
              if (error.status === 404) {
                core.info(`No release found for tag ${tag}. Continuing.`);
                core.setOutput('exists', 'false');
              } else {
                throw error;
              }
            }

      - name: Stop early because release exists
        if: steps.release_check.outputs.exists == 'true'
        shell: bash
        run: |
          echo "Release ${{ steps.version.outputs.tag }} already exists. Skipping build and publish steps."

      - name: Restore packages
        if: steps.release_check.outputs.exists != 'true'
        shell: bash
        run: |
          dotnet restore src/Natrix.TailwindCss/Natrix.TailwindCss.csproj

      - name: Build packages
        if: steps.release_check.outputs.exists != 'true'
        shell: bash
        run: |
          dotnet build src/Natrix.TailwindCss/Natrix.TailwindCss.csproj -c Release --no-restore

      - name: Pack NuGet package
        if: steps.release_check.outputs.exists != 'true'
        shell: bash
        run: |
          mkdir -p artifacts/nuget

          dotnet pack src/Natrix.TailwindCss/Natrix.TailwindCss.csproj -c Release --no-build -o artifacts/nuget \
            -p:NatrixCoreVersion=$MINIMUM_NATRIX_CORE_VERSION \
            -p:NatrixApiVersion=$MINIMUM_NATRIX_API_VERSION

      - name: Check package size
        # The package carries the native V8 library for every supported build
        # host. nuget.org rejects anything over 250 MB, so fail here rather than
        # at push time; the fix is per-RID sub-packages.
        if: steps.release_check.outputs.exists != 'true'
        shell: bash
        run: |
          for pkg in artifacts/nuget/*.nupkg; do
            size_mb=$(( $(stat -c%s "$pkg") / 1048576 ))
            echo "$pkg: ${size_mb} MB" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$size_mb" -gt 240 ]; then
              echo "::error::$pkg is ${size_mb} MB, too close to nuget.org's 250 MB limit"
              exit 1
            fi
          done

      - name: Upload package artifacts
        if: steps.release_check.outputs.exists != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ steps.version.outputs.version }}
          path: artifacts/nuget/*

      - name: NuGet login (OIDC)
        if: steps.release_check.outputs.exists != 'true'
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish package to NuGet
        if: steps.release_check.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          packages=(artifacts/nuget/*.nupkg artifacts/nuget/*.snupkg)

          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "No packages found to publish."
            exit 1
          fi

          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
              --skip-duplicate
          done

      - name: Create GitHub release
        if: steps.release_check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg

      - name: Workflow summary
        shell: bash
        run: |
          {
            echo "## Release Summary"
            echo "- Version: ${{ steps.version.outputs.version }}"
            echo "- Tag: ${{ steps.version.outputs.tag }}"
            echo "- Release exists: ${{ steps.release_check.outputs.exists }}"
          } >> "$GITHUB_STEP_SUMMARY"
