# Host nginx site that forwards natrix.wiki to the compose app. The same nginx
# fronts other services under their own hostnames, so this only matches its own.
# Installed as /etc/nginx/sites-available/natrix and linked into sites-enabled.

server {
    listen 80;
    listen [::]:80;
    server_name natrix.wiki;

    location / {
        # The port compose publishes on loopback.
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
