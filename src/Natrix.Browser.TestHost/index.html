<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" href="data:,"/>
    <title>Natrix browser tests</title>
    <script type="module">
        import {dotnet} from "./_framework/dotnet.js";

        // Called by the host once the page has loaded. `args` are Microsoft.Testing.Platform
        // command line arguments for the test application inside the bundle; `initModule`
        // is the optional ES module the host found next to the bundle, whose exported
        // `init()` runs before the runtime starts. The return value is the exit code.
        globalThis.run = async (args, initModule) => {
            if (initModule) {
                const extension = await import(initModule);
                if (typeof extension.init === "function") {
                    await extension.init();
                }
            }

            const {runMain, getConfig} = await dotnet.create();
            return await runMain(getConfig().mainAssemblyName, args ?? []);
        };
    </script>
</head>
<body>
</body>
</html>
